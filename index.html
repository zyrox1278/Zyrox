<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZYROX</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: radial-gradient(circle at center, #0a0a2e 0%, #000 100%);
    color: #00d4ff;
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}
.orb {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 300px; height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,212,255,0.4) 0%, rgba(0,100,200,0.2) 40%, transparent 70%);
    box-shadow: 0 0 80px rgba(0,212,255,0.6), 0 0 160px rgba(0,212,255,0.3);
    animation: pulse 3s ease-in-out infinite;
    pointer-events: none;
    z-index: 1;
}
@keyframes pulse {
    0%, 100% { transform: translate(-50%,-50%) scale(1); opacity: 0.8; }
    50% { transform: translate(-50%,-50%) scale(1.1); opacity: 1; }
}
.ring {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 400px; height: 400px;
    border-radius: 50%;
    border: 2px solid rgba(0,212,255,0.3);
    box-shadow: 0 0 30px rgba(0,212,255,0.4);
    animation: rotate 10s linear infinite;
    pointer-events: none;
    z-index: 1;
}
@keyframes rotate {
    from { transform: translate(-50%,-50%) rotate(0deg); }
    to { transform: translate(-50%,-50%) rotate(360deg); }
}
.container {
    position: relative;
    z-index: 10;
    width: 90%;
    max-width: 600px;
    background: rgba(0,20,40,0.85);
    border: 1px solid rgba(0,212,255,0.5);
    border-radius: 20px;
    box-shadow: 0 0 40px rgba(0,212,255,0.3);
    padding: 20px;
    backdrop-filter: blur(10px);
}
h1 {
    text-align: center;
    font-size: 28px;
    letter-spacing: 8px;
    margin-bottom: 20px;
    text-shadow: 0 0 20px #00d4ff, 0 0 40px #00d4ff;
    animation: glow 2s ease-in-out infinite alternate;
}
@keyframes glow {
    from { text-shadow: 0 0 20px #00d4ff, 0 0 40px #00d4ff; }
    to { text-shadow: 0 0 30px #00d4ff, 0 0 60px #00d4ff; }
}
#chat {
    height: 350px;
    overflow-y: auto;
    padding: 10px;
    margin-bottom: 15px;
    border: 1px solid rgba(0,212,255,0.2);
    border-radius: 10px;
    background: rgba(0,0,0,0.5);
}
.message {
    margin: 10px 0;
    padding: 10px 15px;
    border-radius: 10px;
    max-width: 85%;
    animation: fadeIn 0.3s ease;
    word-wrap: break-word;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
.user {
    background: rgba(0,212,255,0.15);
    border: 1px solid rgba(0,212,255,0.4);
    margin-left: auto;
    text-align: right;
}
.zyrox {
    background: rgba(0,100,200,0.2);
    border: 1px solid rgba(0,150,255,0.5);
    box-shadow: 0 0 15px rgba(0,150,255,0.2);
}
.input-area {
    display: flex;
    gap: 10px;
}
input {
    flex: 1;
    padding: 12px 15px;
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(0,212,255,0.4);
    border-radius: 10px;
    color: #00d4ff;
    font-family: inherit;
    font-size: 14px;
    outline: none;
}
input:focus { box-shadow: 0 0 20px rgba(0,212,255,0.4); }
button {
    padding: 12px 25px;
    background: linear-gradient(135deg, #0066cc, #00d4ff);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(0,212,255,0.3);
}
button:hover { box-shadow: 0 0 30px rgba(0,212,255,0.6); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="orb"></div>
<div class="ring"></div>
<div class="container">
    <h1>ZYROX</h1>
    <div id="chat">
        <div class="message zyrox">Namaste. Main ZYROX hoon. Batao kya help chahiye?</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off">
        <button id="sendBtn" onclick="sendMessage()">SEND</button>
    </div>
</div>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('userInput');
const btn = document.getElementById('sendBtn');

input.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });

async function sendMessage() {
    const msg = input.value.trim();
    if (!msg) return;
    input.value = '';
    addMessage(msg, 'user');
    const typingDiv = addMessage('...', 'zyrox');
    btn.disabled = true;

    try {
        const res = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg })
        });
        const data = await res.json();
        typingDiv.textContent = data.reply;
    } catch (err) {
        typingDiv.textContent = 'Connection error.';
    }
    btn.disabled = false;
}

function addMessage(text, type) {
    const div = document.createElement('div');
    div.className = 'message ' + type;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
}
</script>
</body>
</html>
